# Staging build: everything comes from mkdocs.yml except what's set here.
#   mkdocs build -f mkdocsstaging.yml
#   mkdocs serve -f mkdocsstaging.yml
INHERIT: mkdocs.yml

site_name: My Docs (staging)
site_dir: site-staging

extra:
  environment: staging
  writer:
    # The Publish button's API, once it's set up: see the top of
    # tools/writer_api/lambda_function.py. Empty: writers publish by hand.
    api: ""
