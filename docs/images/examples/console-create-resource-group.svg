<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <title>Example console: the Create resource group form</title>
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Top bar -->
  <rect width="1200" height="44" fill="#1f2937"/>
  <rect x="16" y="13" width="18" height="18" rx="4" fill="#60a5fa"/>
  <text x="44" y="28" fill="#f9fafb" font-size="14" font-weight="600">Cloud console</text>
  <rect x="380" y="9" width="440" height="26" rx="6" fill="#374151"/>
  <text x="394" y="27" fill="#9ca3af" font-size="12">Search resources, services and docs</text>
  <circle cx="1170" cy="22" r="12" fill="#4b5563"/>
  <!-- Left navigation -->
  <rect y="44" width="220" height="636" fill="#f3f4f6"/>
  <g font-size="13" fill="#374151">
    <text x="24" y="84">Home</text>
    <text x="24" y="116">Dashboard</text>
    <rect x="8" y="132" width="204" height="30" rx="6" fill="#dbeafe"/>
    <text x="24" y="152" fill="#1d4ed8" font-weight="600">Resource groups</text>
    <text x="24" y="188">Virtual networks</text>
    <text x="24" y="220">Key vaults</text>
    <text x="24" y="252">Cost management</text>
  </g>
  <!-- Breadcrumb and title -->
  <text x="256" y="80" fill="#6b7280" font-size="12">Home  ›  Resource groups  ›  Create</text>
  <text x="256" y="116" fill="#111827" font-size="22" font-weight="600">Create a resource group</text>
  <!-- Tabs -->
  <g font-size="13">
    <text x="256" y="156" fill="#1d4ed8" font-weight="600">Basics</text>
    <rect x="252" y="164" width="52" height="3" rx="1.5" fill="#1d4ed8"/>
    <text x="330" y="156" fill="#4b5563">Tags</text>
    <text x="384" y="156" fill="#4b5563">Review + create</text>
  </g>
  <line x1="256" y1="168" x2="1160" y2="168" stroke="#e5e7eb"/>
  <!-- Form -->
  <g font-size="13" fill="#374151">
    <text x="256" y="212" font-weight="600">Subscription *</text>
    <rect x="480" y="194" width="420" height="30" rx="4" fill="#fff" stroke="#9ca3af"/>
    <text x="492" y="214" fill="#111827">Payments – Production</text>
    <path d="M880 205l6 6 6-6" fill="none" stroke="#6b7280" stroke-width="1.6"/>

    <text x="256" y="262" font-weight="600">Resource group *</text>
    <rect x="480" y="244" width="420" height="30" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="492" y="264" fill="#111827">rg-payments-prod-weu-001</text>
    <path d="M876 253l5 5 9-10" fill="none" stroke="#15803d" stroke-width="2"/>

    <text x="256" y="312" font-weight="600">Region *</text>
    <rect x="480" y="294" width="420" height="30" rx="4" fill="#fff" stroke="#9ca3af"/>
    <text x="492" y="314" fill="#111827">West Europe</text>
    <path d="M880 305l6 6 6-6" fill="none" stroke="#6b7280" stroke-width="1.6"/>
  </g>
  <rect x="256" y="354" width="644" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="274" y="380" fill="#1e3a8a" font-size="12.5">A resource group holds related resources for one workload. Name it with the</text>
  <text x="274" y="400" fill="#1e3a8a" font-size="12.5">naming standard so cost reports and policies can find it.</text>
  <!-- Footer buttons -->
  <line x1="220" y1="610" x2="1200" y2="610" stroke="#e5e7eb"/>
  <rect x="256" y="628" width="130" height="32" rx="4" fill="#2563eb"/>
  <text x="321" y="649" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Review + create</text>
  <rect x="398" y="628" width="90" height="32" rx="4" fill="#fff" stroke="#9ca3af"/>
  <text x="443" y="649" fill="#374151" font-size="13" text-anchor="middle">Previous</text>
  <rect x="500" y="628" width="90" height="32" rx="4" fill="#fff" stroke="#9ca3af"/>
  <text x="545" y="649" fill="#374151" font-size="13" text-anchor="middle">Next: Tags</text>
</svg>
